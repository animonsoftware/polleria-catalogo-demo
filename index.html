<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos - Pollería El Buen Sabor (Demo)</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>Pollería El Buen Sabor</h1>
    <p>Arma tu pedido y envíalo por WhatsApp</p>
    <span class="demo">Proyecto de ejemplo (demo)</span>
  </header>
  <main>
    <h2>Elige tu pedido</h2>
    <div id="menu" class="carta"></div>
    <section id="resumen">
      <h2>Tu pedido</h2>
      <ul id="lista"></ul>
      <p class="total">Total: Bs <span id="total">0</span></p>
      <label for="nombre">Tu nombre</label>
      <input id="nombre" type="text" placeholder="Ejemplo: María">
      <label for="nota">Dirección o nota</label>
      <input id="nota" type="text" placeholder="Ejemplo: sin ensalada">
      <button id="enviar" class="boton">Enviar pedido por WhatsApp</button>
    </section>
  </main>
 <script src="app.js"></script>
</body>
</html>
